<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Order | Premium Resources</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #050508;
            --text-white: #ffffff;
            --text-gray: rgba(255, 255, 255, 0.6);
            --accent-glow: rgba(255, 50, 50, 0.4);
            --font-display: 'Cormorant Garamond', serif;
            --font-body: 'Montserrat', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: var(--font-body);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BACKGROUND PARTICLES & GLOW */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(40, 10, 15, 0.5) 0%, rgba(5, 5, 8, 1) 70%);
            z-index: -2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
        }

        /* NAVBAR SLIM */
        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 2rem 4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            mix-blend-mode: difference;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-decoration: none;
            color: #fff;
        }

        /* MAIN CONTAINER */
        .order-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem 2rem;
            position: relative;
        }

        .order-card {
            display: flex;
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            overflow: hidden;
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            opacity: 0;
            transform: translateY(40px);
        }

        /* LEFT SIDE: VISUAL/SUMMARY */
        .order-visual {
            flex: 1;
            background: linear-gradient(135deg, rgba(30, 30, 40, 0.8), rgba(10, 10, 15, 0.9));
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .order-visual::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.03), transparent 60%);
            pointer-events: none;
        }

        .visual-content h1 {
            font-family: var(--font-display);
            font-size: 3.5rem;
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .visual-content p {
            color: var(--text-gray);
            font-weight: 300;
            letter-spacing: 0.05em;
            line-height: 1.6;
            max-width: 80%;
        }

        .product-preview {
            margin-top: 3rem;
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-preview::before {
            content: 'PREMIUM OVERLAYS PACK';
            font-family: var(--font-display);
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
        }

        /* RIGHT SIDE: CHECKOUT FORM */
        .order-form-container {
            flex: 1;
            padding: 4rem;
            display: flex;
            flex-direction: column;
        }

        .form-header {
            margin-bottom: 3rem;
        }

        .title-small {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--accent-glow);
            text-transform: uppercase;
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
        }

        .price-display {
            font-family: var(--font-display);
            font-size: 2.5rem;
        }

        .form-group {
            position: relative;
            margin-bottom: 2rem;
        }

        .form-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 0 0.5rem;
            color: #fff;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group label {
            position: absolute;
            left: 0;
            top: 1rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .form-group input:focus~label,
        .form-group input:valid~label {
            top: -10px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.8);
            letter-spacing: 0.1em;
        }

        .form-group input:focus {
            border-color: #fff;
        }

        .row {
            display: flex;
            gap: 2rem;
        }

        .row .form-group {
            flex: 1;
        }

        .btn-submit {
            margin-top: 1rem;
            background: #fff;
            color: #000;
            font-family: var(--font-body);
            font-weight: 600;
            letter-spacing: 0.15em;
            padding: 1.2rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover {
            transform: scale(1.02);
        }

        .btn-submit:hover::after {
            left: 100%;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .order-card {
                flex-direction: column;
            }

            .order-visual {
                padding: 3rem;
            }

            .visual-content h1 {
                font-size: 2.5rem;
            }

            .order-form-container {
                padding: 3rem;
            }

            .row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <div class="bg-glow"></div>
    <div id="particles"></div>

    <nav class="nav">
        <a href="index.html" class="logo">AVS</a>
    </nav>

    <main class="order-container">
        <div class="order-card" id="order-card">

            <!-- LEFT SIDE SUMMARY -->
            <div class="order-visual">
                <div class="visual-content">
                    <h1 id="product-title">Premium Editing Suite</h1>
                    <p id="product-desc">Gain instant access to our highest-quality assets, light leaks, and overlays
                        designed for elite creators.</p>
                </div>
                <div class="product-preview"></div>
            </div>

            <!-- RIGHT SIDE CHECKOUT -->
            <div class="order-form-container">
                <div class="form-header">
                    <span class="title-small">Total Due</span>
                    <div class="price-display" id="product-price">$99.00</div>
                </div>

                <form id="checkout-form" autocomplete="off">
                    <div class="form-group">
                        <input type="email" id="email" required>
                        <label>Email Address</label>
                    </div>

                    <div class="form-group">
                        <input type="text" id="name" required>
                        <label>Name on Card</label>
                    </div>

                    <div class="form-group">
                        <input type="text" id="card" required maxlength="19"
                            oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(.{4})/g, '$1 ').trim()">
                        <label>Card Number</label>
                    </div>

                    <div class="row">
                        <div class="form-group">
                            <input type="text" id="expiry" required maxlength="5"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/^([2-9])$/g, '0$1').replace(/^(1[3-9])$/g, '01').replace(/^([0-1][0-9])([0-9]{1,2})$/g, '$1/$2')">
                            <label>MM/YY</label>
                        </div>
                        <div class="form-group">
                            <input type="text" id="cvc" required maxlength="4"
                                oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                            <label>CVC</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="submit-btn">CONFIRM PAYMENT</button>
                </form>

                <div class="secure-badge">
                    <svg width="12" height="14" viewBox="0 0 12 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M6 0L0 2.66667V6C0 9.70667 2.56667 13.1533 6 14C9.43333 13.1533 12 9.70667 12 6V2.66667L6 0ZM6 3.33333C7.47333 3.33333 8.66667 4.52667 8.66667 6C8.66667 6.47333 8.52667 6.90667 8.30667 7.28L10 8.97333V10H8.97333L7.28 8.30667C6.90667 8.52667 6.47333 8.66667 6 8.66667C4.52667 8.66667 3.33333 7.47333 3.33333 6C3.33333 4.52667 4.52667 3.33333 6 3.33333ZM5.33333 7.33333H6.66667V4.66667H5.33333V7.33333Z"
                            fill="currentColor" />
                    </svg>
                    Encrypted & Secure Checkout
                </div>

            </div>
        </div>
    </main>

    <script>
        // URL param logic for basic dynamic content
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('product') || '1';

        // Mock product data based on URL index
        const products = {
            '1': { title: 'Premium Overlays Pack', price: '$49.00', desc: '4K Light leaks, film grains, and optical flares for cinematic editing.' },
            '2': { title: 'Essential SFX Library', price: '$79.00', desc: 'Over 1,000 professional sound effects, swooshes, and hits.' },
            '3': { title: 'Avenger LUTs Collection', price: '$99.00', desc: 'Industry-standard color grading presets used by top colorists.' }
        };

        const pData = products[productId] || products['3'];
        document.getElementById('product-title').innerText = pData.title;
        document.getElementById('product-price').innerText = pData.price;
        document.getElementById('product-desc').innerText = pData.desc;

        // Smooth Scroll Init
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smooth: true,
        });
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // GSAP Animations
        gsap.registerPlugin(ScrollTrigger);

        // Initial Entrance
        gsap.to('.order-card', {
            opacity: 1,
            y: 0,
            duration: 1.5,
            ease: 'power4.out',
            delay: 0.2
        });

        // Form Stagger
        gsap.from('.form-group', {
            opacity: 0,
            x: 20,
            duration: 1,
            stagger: 0.1,
            ease: 'power3.out',
            delay: 0.8
        });

        gsap.from('.form-header', {
            opacity: 0,
            y: -20,
            duration: 1,
            ease: 'power3.out',
            delay: 0.6
        });

        // Floating Particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            p.style.width = Math.random() * 4 + 'px';
            p.style.height = p.style.width;
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            particlesContainer.appendChild(p);

            gsap.to(p, {
                y: '-=100',
                x: 'random(-50, 50)',
                opacity: 'random(0.1, 0.5)',
                duration: 'random(10, 20)',
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });
        }

        // Form Submission Mock
        document.getElementById('checkout-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = 'PROCESSING...';
            btn.style.pointerEvents = 'none';

            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = 'PAYMENT SUCCESSFUL <svg style="display:inline; margin-left:10px; width:16px; position:relative; top:2px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                btn.style.background = '#4dff91';

                gsap.to('.order-card', {
                    scale: 1.02,
                    boxShadow: '0 50px 120px rgba(77, 255, 145, 0.2)',
                    duration: 0.5,
                    yoyo: true,
                    repeat: 1
                });

                setTimeout(() => {
                    window.location.href = 'index.html'; // Redirect to home or dashboard
                }, 3000);
            }, 2000);
        });

    </script>
</body>

</html>
