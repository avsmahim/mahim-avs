<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVS Control - Premium Resources</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <style id="dynamic-theme"></style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="nav-left">
      <span class="logo-text">AVS MAHIM</span>
    </div>
    <div class="nav-right">
      <a href="index.html">HOME</a>
      <a href="plugins.html">PLUGIN</a>
      <a href="sfx.html">SFX</a>
      <a href="apps.html">APPS</a>
      <button id="nav-auth-btn" class="btn-yellow" onclick="document.getElementById('auth-modal').classList.add('open')">SIGN UP</button>
    </div>
  </nav>

  <!-- MAIN DYNAMIC CONTENT -->
  <div id="page-content">
      <!-- Sections will be injected here in order by JS -->
  </div>

  <!-- HIDDEN TEMPLATES FOR SECTIONS -->
  <div id="section-templates" style="display: none;">
      
      <section id="Hero" class="mz2-wrapper">
        <div class="mz2-top">
          <div class="mz2-text-block">
            <h2 class="hero-title-main">Get More Plugins</h2>
            <p class="hero-subtitle-text">Premium resources for creators worldwide.</p>
            <a href="#" class="mz2-btn" id="hero-btn">Explore Now ↗</a>
          </div>
        </div>
      </section>

      <section id="Profile" class="imdb-profile-layer">
        <div class="profile-content-inner">
           <div class="avatar-container">
               <img src="" alt="Profile" class="profile-avatar" id="prof-img">
           </div>
           <div class="profile-right">
               <h2 id="prof-name">AVS Mahim</h2>
               <p id="prof-bio">Bangladeshi Creator & Developer.</p>
           </div>
        </div>
      </section>

      <section id="Plugins" class="resources-section">
        <h2 class="section-title">PREMIUM PLUGINS</h2>
        <div class="resources-grid" id="plugins-grid"></div>
      </section>

      <section id="SFX" class="resources-section">
        <h2 class="section-title">CINEMATIC SFX</h2>
        <div class="resources-grid" id="sfx-grid"></div>
      </section>

      <section id="Presets" class="resources-section">
        <h2 class="section-title">PRO PRESETS</h2>
        <div class="resources-grid" id="presets-grid"></div>
      </section>

      <section id="Apps" class="resources-section">
        <h2 class="section-title">WINDOWS APPS</h2>
        <div class="resources-grid" id="apps-grid"></div>
      </section>

      <section id="Footer" class="footer">
        <div class="footer-content">
          <h2 id="foot-title">AVS MAHIM</h2>
          <p id="foot-desc">Professional resources for creators.</p>
          <div class="copyright">&copy; 2026 AVS Mahim.</div>
        </div>
      </section>
  </div>

  <!-- AUTH MODAL (Essential for Login) -->
  <div class="auth-modal-overlay" id="auth-modal">
    <div class="auth-modal-content redesign-modal">
        <button onclick="this.closest('.auth-modal-overlay').classList.remove('open')">&times;</button>
        <div id="auth-ui">
            <!-- Simplified for brevity, usually handled by auth.js -->
            <h2 style="margin-bottom: 2rem;">JOIN AVS CONTROL</h2>
            <input type="email" placeholder="Email" id="auth-email" class="input" style="width:100%; margin-bottom:1rem; padding:10px; background:#000; border:1px solid #333; color:#fff;">
            <button class="btn-yellow" style="width:100%;">Continue</button>
        </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>

  <script>
    (async function renderPage() {
      if (!window.supabaseClient) return;

      // 1. Load Settings
      const { data: settings } = await supabaseClient.from('site_settings').select('*');
      const s = {};
      (settings || []).forEach(r => s[r.key] = r.value);

      // Apply Theme
      document.getElementById('dynamic-theme').innerHTML = `
        :root {
          --btn-color: ${s.color_primary || '#ffd700'};
          --bg-color: ${s.color_bg || '#030609'};
          --text-white: ${s.color_text || '#ffffff'};
        }
        body { background: var(--bg-color); color: var(--text-white); font-family: 'Montserrat', sans-serif; }
      `;

      // Apply Global String Replacements
      if (s.nav_logo_text) document.querySelectorAll('.logo-text, #foot-title').forEach(el => el.textContent = s.nav_logo_text);
      if (s.site_title) document.title = s.site_title;

      // 2. Load Layout & Sections
      const { data: layout } = await supabaseClient.from('page_layout').select('*').order('position', { ascending: true });
      const main = document.getElementById('page-content');
      
      if (layout) {
          for (const row of layout) {
              if (!row.is_visible) continue;
              const template = document.getElementById(row.section_name);
              if (!template) continue;
              
              const section = template.cloneNode(true);
              main.appendChild(section);

              // Inject Section-Specific Data
              if (row.section_name === 'Hero') {
                  if (s.hero_title) section.querySelector('.hero-title-main').textContent = s.hero_title;
                  if (s.hero_subtitle) section.querySelector('.hero-subtitle-text').textContent = s.hero_subtitle;
                  if (s.hero_btn_text) section.querySelector('#hero-btn').textContent = s.hero_btn_text;
                  if (s.hero_btn_link) section.querySelector('#hero-btn').href = s.hero_btn_link;
                  if (s.hero_bg) {
                      if (s.hero_bg.includes('mp4')) {
                          section.style.background = 'none';
                          section.innerHTML = `<video src="${s.hero_bg}" autoplay muted loop style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-1; opacity:0.3;"></video>` + section.innerHTML;
                      } else {
                          section.style.background = `url('${s.hero_bg}') center/cover`;
                      }
                  }
              }

              if (row.section_name === 'Footer') {
                  if (s.footer_desc) section.querySelector('#foot-desc').textContent = s.footer_desc;
              }

              // Load Cards for dynamic sections
              const gridId = row.section_name.toLowerCase() + '-grid';
              const grid = section.querySelector('#' + gridId);
              if (grid) {
                  const table = row.section_name.toLowerCase();
                  const { data: items } = await supabaseClient.from(table).select('*').limit(4);
                  grid.innerHTML = (items || []).map(i => `
                    <div class="resource-card" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; margin: 10px;">
                        <img src="${i.image_url || 'https://via.placeholder.com/300x200'}" style="width:100%; height:200px; object-fit:cover;">
                        <div style="padding: 1.5rem;">
                            <h3>${i.title}</h3>
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1rem;">
                                <span style="color:var(--btn-color); font-weight:800;">${i.is_premium ? '$'+i.price : 'FREE'}</span>
                                <button class="btn-yellow" style="padding:5px 15px; font-size:0.8rem;">GET</button>
                            </div>
                        </div>
                    </div>
                  `).join('');
                  grid.style.display = 'grid';
                  grid.style.gridTemplateColumns = 'repeat(auto-fill, minmax(280px, 1fr))';
              }
          }
      }

      // Check Maintenance
      if (s.maintenance_mode === 'true') {
          document.body.innerHTML = "<div style='height:100vh; display:flex; align-items:center; justify-content:center; background:#000; color:var(--btn-color);'><h1>UNDER MAINTENANCE</h1></div>";
      }
    })();
  </script>
</body>
</html>
